:root{--royal:#173CDB;--deep:#0A1242;--red:#FF2E3B;--mist:#C3CEFF;--line:rgba(130,160,255,.32)}
*{box-sizing:border-box}
body{margin:0;background:var(--royal);color:#fff;font:400 18px/1.6 "Barlow",Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:40px 16px 64px}
.mark{font:700 italic 24px/1 "Barlow Condensed",sans-serif}
.mark b{color:var(--red)}
h1{margin:28px 0 8px;font:400 clamp(64px,16vw,150px)/.88 "Anton",Impact,sans-serif;text-transform:uppercase;color:var(--red)}
p.lede{max-width:34ch;color:#fff;margin:0 0 36px;font-size:20px}
.list{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:block;text-decoration:none;color:#fff;background:var(--deep);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:9/12;object-fit:cover}
.card div{padding:14px 16px 18px}
.card b{display:block;font:400 34px/1 "Anton",Impact,sans-serif;text-transform:uppercase}
.card span{color:var(--mist);font-size:16px}
.card:hover{border-color:#fff}
.card:focus-visible{outline:3px solid #4BE0FF;outline-offset:3px}
</style>
